services:
  # 後端 API（免費方案）。
  # 注意：免費 Web Service 不支援持久磁碟，也不在雲端重跑預測。
  # 預測結果是「本機跑好後打包進 repo」，這裡只負責把 data/forecasts 內的檔案送出去。
  # DATA_DIR 採 app/config.py 預設值 ./data/forecasts（相對於 backend rootDir = repo 內資料）。
  - type: web
    name: cpi-api
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # 釘 Python 3.11（對齊 Dockerfile）。Render 原生 runtime 預設為 3.13，
      # 但 numpy 1.26 / scipy 1.13 / pmdarima 2.0.4 在 3.13 無預編譯 wheel，
      # 會改從原始碼編譯而卡在 Deploying。
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ADMIN_TOKEN
        sync: false
      # 前端網址：用於 CORS 白名單（公開網址，非機密，直接寫死）
      - key: FRONTEND_ORIGIN
        value: https://cpi-frontend.onrender.com
      - key: DGBAS_URL
        value: https://ws.dgbas.gov.tw/001/Upload/461/relfile/11525/230543/pr0101a3m.xml
      - key: KEEP_RUNS
        value: 12

  # 前端靜態站（免費、不休眠）。
  - type: web
    name: cpi-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    envVars:
      # 後端 API 網址：建置期編進前端 bundle（公開網址，非機密，直接寫死）
      - key: VITE_API_BASE_URL
        value: https://cpi-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

# 每月自動更新（cpi-monthly-recompute cron）已移除：Render Cron Job 非免費。
# 改成每月在本機重跑預測並 git push，Render 會自動重新部署。詳見 README。
